syntax = "proto3";

package facerecognition;
option csharp_namespace = "FaceRecognitionGrpc";

service FaceRecognition {
  rpc EmbedFace (Face) returns (EmbedResponse);
  rpc VerifyRoom (Image) returns (PersonsInRoom);
}

message Face {
  string person_name = 1;
  bytes image = 2;
}

message Image {
  bytes image = 1;
}

message EmbedResponse {
    repeated float embedding = 1;
}

message PersonsInRoom {
  repeated string persons = 1;
  int32 total = 2;
}