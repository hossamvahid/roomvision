name: Docker Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

     
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

     
      - name: Build & Push Backend (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./roomvision-be/src
          file: ./roomvision-be/src/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/roomvision-be:latest

    
      - name: Build & Push Frontend (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./roomvision-fe
          file: ./roomvision-fe/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/roomvision-fe:latest

    
      - name: Build & Push FaceRecognition (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./roomvision-scripts
          file: ./roomvision-scripts/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/roomvision-facerecognition:latest
